<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SurveyMars 课堂填表助手</title><link rel="stylesheet" href="style.css"></head><body><main>
<span class="tag">WINDOWS · EDGE / CHROME</span><h1>课堂填表，少打两行字。</h1><p>保存个人信息，放入二维码，打开表单自动填写。</p>
<section><h2>01 / 个人信息</h2><div class="row"><label>姓名<input id="name" autocomplete="off" placeholder="与课程名单一致的姓名"></label><label>学号<input id="studentId" autocomplete="off" placeholder="保留开头的 0"></label></div><button id="save">保存信息</button><button class="secondary" id="clear">清除保存的信息</button><small>仅保存在此浏览器的本地扩展存储中，不进行云同步。</small></section>
<section><h2>02 / 放入课堂二维码</h2><div id="drop" tabindex="0">拖入图片，或在此页面按 Ctrl + V 粘贴截图<label class="file">选择二维码图片<input id="file" type="file" accept="image/*"></label></div><label>识别出的链接（也可以直接粘贴）<input id="url" type="url" placeholder="https://surveymars.com/q/…"></label><button id="open">打开表单并自动填写</button><small>填写后请核对课程和个人信息，再在表单中点击 Submit。</small></section><p id="status" role="status" aria-live="polite">准备就绪。</p>
<footer>图片在本机识别。仅接受 HTTPS SurveyMars 问卷链接；验证码、登录和其他题目需手动处理。</footer></main><script src="jsQR.js"></script><script src="helper.js"></script></body></html>
